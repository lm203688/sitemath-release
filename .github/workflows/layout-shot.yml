name: layout-shot

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # CI-only 探针配置：开全部方向 + 允许 iPad，只为拍到 wide 分支真实画面，不改产品配置
      - name: Patch config for probe
        run: |
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("app.json","utf8"));
            j.orientation="default";
            if(!j.ios) j.ios={};
            j.ios.supportsTablet=true;
            fs.writeFileSync("app.json", JSON.stringify(j,null,2));
            console.log("orientation=",j.orientation,"tablet=",j.ios.supportsTablet);
          '

      - name: Prebuild
        run: npx expo prebuild --platform ios --clean --non-interactive

      - name: Build (Release, JS bundled)
        run: |
          set -o pipefail
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild build -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -20
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" > bundle.txt
          cat bundle.txt

      - name: Shoot on Duo (outer) and iPad
        run: |
          set +e
          BUNDLE=$(cat bundle.txt)
          mkdir -p out
          shoot() {
            NAME="$1"; TYPE="$2"
            UDID=$(xcrun simctl create "$NAME" "$TYPE" com.apple.CoreSimulator.SimRuntime.iOS-27-1)
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$app"
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE" > "$RUNNER_TEMP/$NAME.log" 2>&1 &
            sleep 35
            if [ "$TYPE" = "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo" ]; then
              xcrun simctl io "$UDID" screenshot --display=1 "out/$NAME-duo-outer.png"
            else
              xcrun simctl io "$UDID" screenshot "out/$NAME.png"
            fi
            grep -aF "[duo]" "$RUNNER_TEMP/$NAME.log" | tail -3 || true
          }
          shoot "iPadPro11" com.apple.CoreSimulator.SimDeviceType.iPad-Pro-11-inch-M4-8GB
          shoot "Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
          ls -l out
          for f in out/*.png; do sips -g pixelWidth -g pixelHeight "$f"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-shots
          path: out
          if-no-files-found: warn
